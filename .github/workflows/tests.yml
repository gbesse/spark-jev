name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platform SDK
        run: pip install "pyspark>=3.5,<5"
      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v
